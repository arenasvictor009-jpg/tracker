name: tracker

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Send test notification
        if: ${{ github.event.inputs.test == 'true' }}
        run: python tracker.py --test
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Check signals
        if: ${{ github.event.inputs.test != 'true' }}
        run: python tracker.py --once
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TICKERS: "SPY,QQQ,META"
      - name: Save state
        run: |
          git config user.name "tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state" && git push)

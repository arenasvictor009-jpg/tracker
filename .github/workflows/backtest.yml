name: backtest

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tracker.py --backtest
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TICKERS: "SPY,QQQ,META"
